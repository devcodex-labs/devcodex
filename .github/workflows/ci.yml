name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: Core (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 18.x
          - os: ubuntu-latest
            node: 20.x
          - os: ubuntu-latest
            node: 22.x
          - os: windows-latest
            node: 22.x
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run test:core
      - run: npm run test:checked-command

  full-quality:
    name: Full quality (Node 20.19)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm
      - run: npm ci
      - if: ${{ hashFiles('website/package-lock.json') != '' }}
        run: npm ci --prefix website
      - run: npm test
      - run: npm run test:coverage
      - run: npm run test:audit

  website-package:
    name: Website and package (Node 22.14)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
      - run: npm ci
      - if: ${{ hashFiles('website/package-lock.json') != '' }}
        run: npm ci --prefix website
      - if: ${{ hashFiles('website/package-lock.json') != '' }}
        run: npm --prefix website run build
      - if: ${{ hashFiles('website/package-lock.json') != '' }}
        run: node scripts/check-generated-site-links.js
      - run: npm run release:dry-run:all
      - run: npm run test:pack-clean
