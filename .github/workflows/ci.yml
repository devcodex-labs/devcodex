name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  supported-control-plane:
    name: Control plane (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 18.17.0
            route: test:supported-runtime-control-plane
          - os: ubuntu-latest
            node: 22.x
            route: test:supported-runtime-control-plane
          - os: ubuntu-latest
            node: 26.x
            route: test:supported-runtime-control-plane
          - os: windows-latest
            node: 18.17.0
            route: test:windows-control-plane
          - os: windows-latest
            node: 24.17.0
            route: test:windows-control-plane
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run ${{ matrix.route }}

  full-quality:
    name: Full quality (Node 24.17)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.17.0
          cache: npm
      - run: npm ci
      - if: ${{ hashFiles('website/package-lock.json') != '' }}
        run: npm ci --prefix website
      - run: npm test
      - run: npm run test:coverage
      - run: npm run test:audit

  website-package:
    name: Package boundary (Node 24.17)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.17.0
          cache: npm
      - run: npm ci
      - run: npm run release:dry-run:all
      - run: npm run test:pack-clean
